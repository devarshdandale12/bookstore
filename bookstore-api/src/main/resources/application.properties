spring.config.import=optional:classpath:application-local.properties

spring.application.name=bookstore-api
server.port=8080



# ---------- JPA / Hibernate ----------
# "update" creates / updates tables from the entity classes automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT ----------
# Base64 secret (at least 256 bits). Replace it with your own for any real deployment.
app.jwt.expiration-ms=86400000

# ---------- First admin account (created on first start if no admin exists) ----------


# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
