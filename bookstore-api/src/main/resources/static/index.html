<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shelfwise Books</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/">Shelfwise</a>
    <form id="searchForm" class="search" role="search">
      <input id="searchInput" type="search" placeholder="Search by title or author" aria-label="Search books">
      <button class="primary" type="submit">Search</button>
    </form>
    <nav id="nav" aria-label="Main"></nav>
  </header>

  <main id="app"></main>

  <div id="scrim" data-action="close-cart" hidden></div>
  <aside id="cartDrawer" class="drawer" aria-hidden="true" aria-label="Shopping cart">
    <div class="drawer-head">
      <h2>Your cart</h2>
      <button class="ghost" data-action="close-cart">Close</button>
    </div>
    <div id="cartBody" class="drawer-body"></div>
    <div id="cartFoot" class="drawer-foot"></div>
  </aside>

  <div id="modalRoot"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
